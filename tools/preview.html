<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MIA SAN MIA · 拜仁启动插件预览</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#101116;color:#f0edef;font-family:"Segoe UI","Microsoft YaHei",sans-serif}
.host{min-height:100vh;display:grid;place-content:center;text-align:center;padding:40px}.host .eyebrow{font:10px Consolas,monospace;letter-spacing:.25em;color:#cd2044}.host h1{font-size:38px;margin:20px 0}.host p{color:#8e919d;font-size:13px;line-height:1.9;margin:0}.host button{margin:28px auto 0;background:#dc052d;color:white;border:0;border-radius:5px;padding:12px 20px;cursor:pointer}.host small{color:#646978;margin-top:25px;font-size:11px}
.controls{position:fixed;left:50%;bottom:13px;transform:translateX(-50%);z-index:10010;display:flex;align-items:center;gap:7px;max-width:calc(100vw - 40px);background:#171920f2;border:1px solid #ffffff20;padding:7px 10px;border-radius:8px;box-shadow:0 8px 30px #0007;white-space:nowrap}
.controls button,.controls select{font:11px "Segoe UI","Microsoft YaHei",sans-serif;background:#242630;color:#d4d1d7;border:1px solid #ffffff15;border-radius:4px;padding:6px 9px;cursor:pointer}.controls button:hover{background:#3b2630}.controls button[aria-pressed=true]{background:#5a1729;border-color:#a91b3d}.controls .preview-label{font:9px Consolas,monospace;letter-spacing:.12em;color:#787d8b;margin-right:4px}.controls output{font:10px Consolas,monospace;color:#999fac;min-width:31px}button:focus-visible,select:focus-visible{outline:2px solid #fafafa;outline-offset:3px}
@media(max-width:600px){.controls{gap:4px;padding:6px;bottom:8px}.controls .preview-label{display:none}.controls button,.controls select{font-size:10px;padding:6px}.controls output{display:none}.host h1{font-size:26px}}
html[data-clean] .controls{display:none}
</style></head><body>
<div class="host"><div class="eyebrow">MIA SAN MIA / PREVIEW</div><h1>欢迎回到主场。</h1><p>拜仁主题启动插件 · 本地体验预览<br>正式安装后，这一步将显示你的 DeepSeek Harness 界面。</p><button id="host-replay">再次播放开场 ↗</button><small>9 秒开场 · 停留 1 秒后自动进入 · Esc 跳过</small></div>
<div id="overlay-host"></div>
<nav class="controls" aria-label="预览播放控制">
<span class="preview-label">PREVIEW · v0.1.8</span><button id="replay">重播</button><button id="pause" aria-pressed="false">暂停</button>
<select id="scene" aria-label="跳转到动画阶段"><option value="">实时播放</option><option value="1.5">01 点亮主场</option><option value="3.8">02 队徽入场</option><option value="9">03 主场就绪</option></select>
<button id="reduced" aria-pressed="false">缩减动画</button><output id="time">00.0</output>
</nav>
<script>
let plugin, createPlugin, cleanups = [], refCleanup = null, bootNode = null;
window.__ModuleLoader__ = {load({factory}) {
 createPlugin = () => factory(name => {
  if (name !== "react") throw new Error("Unexpected module " + name);
  return {createElement(type,props) {return {type,props:props || {}};}};
 });
}};
</script><script src="../lib/client.js?v=0.1.8"></script><script>
const query = new URLSearchParams(location.search);
if (query.has("clean")) document.documentElement.dataset.clean = "";
let paused = false, reduced = query.has("reduced"), frozen = false, elapsed = 0, base = performance.now();
const $ = id => document.getElementById(id);
const realSetTimeout = window.setTimeout.bind(window), realClearTimeout = window.clearTimeout.bind(window);
const previewTimers = new Map();
let previewClock = 0, previewTimerId = 0, previousTick = performance.now();
window.setTimeout = (callback, delay = 0, ...args) => {
 const id = --previewTimerId;
 previewTimers.set(id, {at:previewClock + Math.max(0, Number(delay) || 0), callback:()=>callback(...args)});
 return id;
};
window.clearTimeout = id => { if(id < 0)previewTimers.delete(id);else realClearTimeout(id); };
function advanceTimers(target) {
 while(true) {
  const due=[...previewTimers].filter(([,timer])=>timer.at<=target).sort((a,b)=>a[1].at-b[1].at)[0];
  if(!due)break;
  previewTimers.delete(due[0]);previewClock=due[1].at;due[1].callback();
 }
 previewClock=target;
}
function tickTimers(now) {
 const delta = Math.max(0, now - previousTick); previousTick = now;
 if(!bootNode || (paused && !bootNode.hasAttribute("data-leaving")))return;
 advanceTimers(previewClock + delta);
}
let loadingFixture = null, initialMountTimer = null;
if (query.has("handoff")) {
 const css=document.createElement("style");
 css.textContent='.native-boot{position:fixed;inset:0;display:grid;place-items:center;background:#141414;color:#f9fafb;font:16px Arial,sans-serif;z-index:100}.native-card{display:flex;flex-direction:column;align-items:center;gap:16px}.native-wordmark{font-size:16px;line-height:24px;font-weight:600;letter-spacing:.08em}.native-spinner{width:20px;height:20px;border:2px solid #ffffff25;border-top-color:#f9fafb;border-right-color:#f9fafb;border-radius:50%;animation:native-spin .8s linear infinite}.native-hint{font-size:12px;line-height:18px;color:#adb2b8}@keyframes native-spin{to{transform:rotate(360deg)}}';
 document.head.append(css);
 loadingFixture=document.createElement("div");loadingFixture.className="native-boot";loadingFixture.setAttribute("data-dsh-boot","");
 loadingFixture.innerHTML='<div class="native-card"><div class="native-wordmark">HARNESS</div><div class="native-spinner" data-dsh-boot-spinner></div><div class="native-hint">Loading plugins...</div></div>';
 document.body.append(loadingFixture);
}
function dispose() {
 for (const cleanup of cleanups.reverse()) cleanup();
 cleanups = [];
 if(refCleanup) refCleanup();
 refCleanup = null;
 $("overlay-host").replaceChildren();
 bootNode = null;
 previewTimers.clear();
}
function mount({time=null,still=false}={}) {
 clearTimeout(initialMountTimer);initialMountTimer=null;
 dispose();
 previewClock = 0; previousTick = performance.now();
 paused = still; frozen = time !== null; elapsed = time || 0; base = performance.now() - elapsed * 1000;
 const ctx = {
  effect(fn) { const cleanup = fn(); if(typeof cleanup === "function") cleanups.push(cleanup); },
  slots: {
   inject(name,fn) {if(name!=="shell.overlay")throw new Error("Unexpected slot");fn();},
   register(spec,Component) {
    const element = Component();
    if(!element)throw new Error("Startup window expired; refresh this page to replay.");
    const node = document.createElement(element.type);
    for(const [key,value] of Object.entries(element.props)) {
     if(key==="ref" || key==="dangerouslySetInnerHTML") continue;
     node.setAttribute(key,value);
    }
    node.innerHTML = element.props.dangerouslySetInnerHTML.__html;
    $("overlay-host").appendChild(node);
    bootNode = node;
    element.props.ref(node);
    refCleanup = () => element.props.ref(null);
   }
  }
 };
 // The real plugin code is used above; this renderer only replaces the host/React bridge.
 plugin = createPlugin(); plugin.apply(ctx);
 if(loadingFixture) {loadingFixture.remove();loadingFixture=null;}
 bootNode.style.setProperty("--bb-offset", (-elapsed) + "s");
 bootNode.style.setProperty("--bb-state",paused?"paused":"running");
 if(reduced) {bootNode.setAttribute("data-reduced","");bootNode.setAttribute("data-ready","");}
 if(time!==null && time>=9)bootNode.setAttribute("data-ready","");
 $("pause").textContent=paused?"继续":"暂停";$("pause").setAttribute("aria-pressed",String(paused));
 $("reduced").setAttribute("aria-pressed",String(reduced));
 $("scene").value=time===null?"":String(time);
 if(time!==null)advanceTimers(bootNode.hasAttribute("data-reduced")?0:Math.min(9,Math.max(0,time))*1000);
 previousTick=performance.now();base=previousTick-elapsed*1000;
}
$("replay").onclick=()=>mount();
$("host-replay").onclick=()=>mount();
$("pause").onclick=()=>{
 if(!bootNode || bootNode.style.display==="none"){mount();return;}
 paused=!paused;
 if(paused)elapsed=(performance.now()-base)/1000;else base=performance.now()-elapsed*1000;
 bootNode.style.setProperty("--bb-state",paused?"paused":"running");
 $("pause").textContent=paused?"继续":"暂停";$("pause").setAttribute("aria-pressed",String(paused));
};
$("scene").onchange=()=>mount({time:$("scene").value?Number($("scene").value):null,still:!!$("scene").value});
$("reduced").onclick=()=>{reduced=!reduced;mount(reduced?{time:9,still:true}:{});};
window.addEventListener("beforeunload",dispose);
function clock() {
 tickTimers(performance.now());
 const time = paused ? elapsed : (performance.now()-base)/1000;
 if(bootNode) { if(reduced || bootNode.hasAttribute("data-reduced") || time >= 9)bootNode.setAttribute("data-ready","");else bootNode.removeAttribute("data-ready"); }
 $("time").textContent=Math.max(0,time).toFixed(1).padStart(4,"0");
 requestAnimationFrame(clock);
}
const initialMount=()=>mount({time:query.has("t")?Number(query.get("t")):null,still:query.has("t")});
if(query.has("handoff")&&!query.has("t"))initialMountTimer=realSetTimeout(initialMount,800);else initialMount();
clock();
</script></body></html>
